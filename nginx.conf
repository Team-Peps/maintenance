server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Sonde Kubernetes
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Fichiers statiques de la page
    location ~ ^/(css|js|img)/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # Toutes les autres URL : 503 + page de maintenance
    location / {
        return 503;
    }

    error_page 503 /index.html;

    location = /index.html {
        internal;
        add_header Retry-After 1800 always;
        add_header Cache-Control "no-store" always;
    }
}
