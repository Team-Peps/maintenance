# Compte de service utilisé par le workflow GitHub « Mode maintenance ».
# Droits limités au namespace du site, et au strict nécessaire pour basculer.
#
# À appliquer une fois, par un admin du cluster :
#   kubectl -n <namespace> apply -f k8s/rbac.yaml
#
# Adapter « teampeps-front » si le Service du front porte un autre nom.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-maintenance
---
apiVersion: v1
kind: Secret
metadata:
  name: github-maintenance-token
  annotations:
    kubernetes.io/service-account.name: github-maintenance
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-maintenance
rules:
  # Basculer le Service du front (sélecteur + annotation de sauvegarde)
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: ["teampeps-front"]
    verbs: ["get", "patch"]
  # Créer / mettre à jour la configuration de la page
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["maintenance-config"]
    verbs: ["get", "patch", "update"]
  # Déployer / redémarrer le pod de maintenance
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["maintenance"]
    verbs: ["get", "patch", "update"]
  # Suivre le déploiement (rollout status), lecture seule
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-maintenance
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: github-maintenance
subjects:
  - kind: ServiceAccount
    name: github-maintenance
