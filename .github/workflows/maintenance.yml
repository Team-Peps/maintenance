name: Mode maintenance

run-name: "Maintenance : ${{ inputs.action }}"

on:
  # Bouton « Run workflow » dans l'onglet Actions
  workflow_dispatch:
    inputs:
      action:
        description: "Action"
        type: choice
        options:
          - "on"
          - "off"
          - status
        default: status
      return_at:
        description: "Heure de retour (optionnel, ex. 2026-10-30T21:00:00+01:00)"
        type: string
        required: false

  # Appel depuis un autre workflow (ex. le déploiement du front)
  workflow_call:
    inputs:
      action:
        type: string
        required: true
      return_at:
        type: string
        required: false
    secrets:
      KUBE_CONFIG:
        required: true
      DISCORD_WEBHOOK_URL:
        required: false

permissions:
  contents: read

# Une seule bascule à la fois
concurrency:
  group: maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    name: Maintenance ${{ inputs.action }}
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 10
    env:
      NAMESPACE: ${{ vars.K8S_NAMESPACE || 'peps-prod' }}
      FRONT_SERVICE: ${{ vars.FRONT_SERVICE || 'peps-frontend' }}
      RETURN_AT: ${{ inputs.return_at }}
    steps:
      - name: Vérifier l'action
        env:
          ACTION: ${{ inputs.action }}
        run: |
          case "$ACTION" in
            on|off|status) ;;
            *) echo "Action inconnue : $ACTION (on, off ou status)"; exit 1 ;;
          esac

      - name: Récupérer le dépôt de la page
        uses: actions/checkout@v4
        with:
          repository: Team-Peps/maintenance

      - name: Installer kubectl
        uses: azure/setup-kubectl@v4

      - name: Configurer l'accès au cluster
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -z "$KUBE_CONFIG" ]; then
            echo "Le secret KUBE_CONFIG est manquant."
            exit 1
          fi
          # Accepte le kubeconfig en base64 (comme le front) ou en YAML brut
          if decoded="$(printf '%s' "$KUBE_CONFIG" | tr -d '\n' | base64 -d 2>/dev/null)" \
            && printf '%s' "$decoded" | grep -q '^apiVersion:'; then
            printf '%s\n' "$decoded" > "$RUNNER_TEMP/kubeconfig"
          else
            printf '%s\n' "$KUBE_CONFIG" > "$RUNNER_TEMP/kubeconfig"
          fi
          chmod 600 "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Maintenance ${{ inputs.action }}
        env:
          ACTION: ${{ inputs.action }}
        run: bash scripts/maintenance.sh "$ACTION"

      - name: Notification Discord
        if: success() && (inputs.action == 'on' || inputs.action == 'off')
        env:
          ACTION: ${{ inputs.action }}
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_URL absent : notification ignorée."
            exit 0
          fi

          if [ "$ACTION" = "on" ]; then
            TITLE="🛠️ Maintenance en cours"
            DESC="**teampeps.fr** est passé en maintenance."
            COLOR=13200679
            if [ -n "$RETURN_AT" ] && ts="$(date -d "$RETURN_AT" +%s 2>/dev/null)"; then
              DESC="$DESC"$'\n'"**Retour prévu :** <t:$ts:F> (<t:$ts:R>)"
            fi
          else
            TITLE="✅ Maintenance terminée"
            DESC="**teampeps.fr** est de nouveau en ligne."
            COLOR=3066993
          fi

          payload="$(jq -n \
            --arg title "$TITLE" \
            --arg desc "$DESC" \
            --arg actor "$ACTOR" \
            --argjson color "$COLOR" \
            '{username: "Team Peps CI/CD", embeds: [{title: $title, description: ($desc + "\n**Auteur :** " + $actor), color: $color}]}')"

          curl -sS --fail -H "Content-Type: application/json" -X POST -d "$payload" "$WEBHOOK" \
            || echo "::warning::Notification Discord non envoyée."

      - name: Nettoyer
        if: always()
        run: rm -f "$RUNNER_TEMP/kubeconfig"
