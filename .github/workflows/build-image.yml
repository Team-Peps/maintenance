name: Image de la page

on:
  push:
    branches: [main]
    paths:
      - index.html
      - css/style.css
      - js/main.js
      - nginx.conf
      - Dockerfile
      - .github/workflows/build-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Construire et publier l'image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/team-peps/maintenance:latest
            ghcr.io/team-peps/maintenance:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
