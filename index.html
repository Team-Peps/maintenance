<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0b0b0c" />
    <meta
      name="description"
      content="teampeps.fr est en maintenance : une nouvelle version du site est en cours de déploiement."
    />
    <title>Maintenance en cours · Team Peps</title>
    <link rel="icon" type="image/png" href="img/logo_team_peps_2026.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=JetBrains+Mono:wght@400;700&family=Noto+Sans:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="min-h-dvh bg-peps-dark-900 font-sans text-zinc-100 antialiased">
    <main
      class="mx-auto flex min-h-dvh w-full max-w-[1280px] flex-col gap-8 px-4 py-7 sm:px-8 lg:px-12"
    >
      <!-- En-tête -->
      <header class="flex items-center justify-between gap-4">
        <a
          href="/"
          class="flex items-center gap-2.5 font-display text-2xl font-extrabold uppercase"
        >
          <img
            src="img/logo_team_peps_2026.png"
            alt=""
            class="size-8 object-contain"
          />
          Team Peps
        </a>
        <p class="font-mono text-[13px] text-peps-muted">
          Status:
          <span id="status-label" class="text-peps-gold">deploying</span>
        </p>
      </header>

      <!-- Titre -->
      <section class="flex flex-col gap-3.5" aria-labelledby="title">
        <p class="font-mono text-sm text-peps-gold">// Maintenance en cours</p>
        <h1
          id="title"
          class="font-display text-[clamp(44px,12vw,132px)] leading-[.82] break-words font-extrabold text-peps-dark-200 uppercase"
        >
          Nouvelle version<br /><span class="text-peps-gold"
            >en déploiement</span
          >
        </h1>
        <p class="max-w-[56ch] text-base leading-relaxed text-zinc-300">
          On installe une nouvelle version de teampeps.fr. Le site revient
          <strong id="return-info" class="font-medium text-zinc-100"
            >vite</strong
          >
        </p>
      </section>

      <!-- Terminal + patch notes -->
      <div class="flex flex-1 flex-col items-stretch gap-6 lg:flex-row">
        <!-- Terminal -->
        <section
          class="flex min-w-0 flex-1 flex-col border border-peps-dark-600 bg-peps-dark-800 shadow-[10px_10px_0_rgb(238_201_50/0.12)]"
          aria-label="Journal de déploiement"
        >
          <div
            class="flex items-center gap-2 border-b border-peps-dark-600 bg-peps-dark-700 px-3.5 py-2.5"
          >
            <span class="size-[11px] rounded-full bg-peps-red"></span>
            <span class="size-[11px] rounded-full bg-peps-gold"></span>
            <span class="size-[11px] rounded-full bg-peps-ok"></span>
            <span class="ml-2.5 truncate font-mono text-xs text-peps-dim"
              >serkox@teampeps.fr: ~/deploy</span
            >
          </div>

          <div
            class="flex flex-1 flex-col gap-2 p-5 font-mono text-[13px] leading-normal sm:text-sm"
          >
            <ol
              id="log"
              role="log"
              aria-live="polite"
              class="flex flex-col gap-[7px]"
            >
              <noscript>
                <li class="text-zinc-300">
                  Maintenance en cours. Le site revient très vite.
                </li>
              </noscript>
            </ol>

            <div
              id="progress"
              class="hidden flex-col gap-2 pt-1.5"
              aria-hidden="true"
            >
              <div class="flex justify-between gap-3 text-peps-gold">
                <span>déploiement <span class="spinner"></span></span>
                <span
                  ><span id="progress-ascii">[░░░░░░░░░░]</span>
                  <span id="progress-pct">0%</span></span
                >
              </div>
              <div class="h-1.5 bg-peps-dark-600">
                <div
                  id="progress-bar"
                  class="h-full w-0 bg-peps-gold transition-[width] duration-1000 ease-out"
                ></div>
              </div>
            </div>

            <p id="prompt" class="hidden text-zinc-100" aria-hidden="true">
              $
              <span
                class="inline-block h-[17px] w-[9px] translate-y-[3px] animate-caret bg-peps-gold"
              ></span>
            </p>
          </div>
        </section>

        <!-- Patch notes -->
        <aside
          class="flex w-full flex-none flex-col gap-3.5 lg:w-[400px]"
          aria-labelledby="notes-title"
        >
          <div class="cut-corners bg-peps-gold p-0.5">
            <div
              class="cut-corners-inner flex flex-col gap-3.5 bg-peps-dark-700 px-5.5 py-5"
            >
              <div class="flex items-baseline justify-between gap-2.5">
                <h2
                  id="notes-title"
                  class="font-display text-[28px] leading-none font-extrabold uppercase"
                >
                  Patch notes
                </h2>
                <span
                  id="version"
                  class="font-mono text-[13px] text-peps-gold"
                ></span>
              </div>
              <ul id="notes" class="flex flex-col gap-3"></ul>
            </div>
          </div>

          <div class="flex flex-wrap gap-2.5">
            <button
              id="retry"
              type="button"
              class="flex min-h-[50px] flex-[1_1_160px] cursor-pointer items-center justify-center gap-2 bg-peps-dark-200 font-display text-lg font-extrabold text-peps-dark-700 uppercase transition hover:-translate-x-[3px] hover:-translate-y-[3px] hover:shadow-[5px_5px_0_#EEC932] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-peps-gold"
            >
              <svg
                class="size-[18px]"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.6"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7" />
              </svg>
              Réessayer
            </button>
            <div id="links" class="contents"></div>
          </div>

          <p
            id="back-online"
            role="status"
            class="hidden items-center gap-2.5 border-l-[3px] border-peps-ok bg-peps-dark-700 px-4 py-3 text-sm"
          >
            <svg
              class="size-5 flex-none"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#4ade80"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M5 12l5 5 9-10" />
            </svg>
            Le site est de retour, redirection…
          </p>
        </aside>
      </div>

      <!-- Pied de page -->
      <footer
        class="flex flex-wrap justify-between gap-2 font-mono text-xs text-[#5a5d64]"
      >
        <span>© <span id="year"></span> Team Peps</span>
      </footer>
    </main>

    <script src="js/config.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
